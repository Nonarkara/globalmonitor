name: Deploy to Cloudflare Pages

on:
  push:
    # This branch is the World Console (global.nonarkara.org). It deploys on
    # pushes to ITSELF, to its own Pages project — never to the flagship's.
    branches: [middleeast]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci || npm install
      - name: Refresh AIS snapshot (optional — needs AISSTREAM_API_KEY secret)
        run: npm run refresh:ais
        continue-on-error: true
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
      - name: Refresh OpenSky safety snapshot
        run: npm run refresh:flights
      - run: npx vite build
        env:
          VITE_API_BASE_URL: ""
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Must match wrangler.toml (globalmonitor-me) and package.json. The
          # Pages project's production branch is `middleeast`, not main.
          command: pages deploy dist --project-name=globalmonitor-me --branch=middleeast
