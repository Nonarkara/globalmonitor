name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci || npm install
      - name: Refresh AIS snapshot (optional — needs AISSTREAM_API_KEY secret)
        run: npm run refresh:ais
        continue-on-error: true
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
      - name: Refresh OpenSky safety snapshot
        run: npm run refresh:flights
      - run: npx vite build
        env:
          VITE_API_BASE_URL: ""
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Must match wrangler.toml / package.json. This branch is the Asia
          # build (asia.nonarkara.org); the flagship lives on branch `classic`
          # and Pages project `globalmonitor`, which this workflow must never
          # deploy over.
          command: pages deploy dist --project-name=asiawatch --branch=main
