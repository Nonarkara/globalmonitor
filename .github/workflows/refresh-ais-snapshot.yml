# Refresh static AIS snapshot and redeploy — Cloudflare Workers cannot collect AIS via WebSocket.
# Requires repository secret: AISSTREAM_API_KEY
name: Refresh AIS snapshot

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  refresh-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci || npm install
      - name: Collect AIS snapshot (30s)
        run: npm run refresh:ais
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
      - name: Refresh OpenSky safety snapshot
        run: npm run refresh:flights
      - run: npx vite build
        env:
          VITE_API_BASE_URL: ""
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=globalmonitor --branch=main
