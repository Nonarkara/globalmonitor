name: CI

on:
  push:
    branches: [middleeast]
  pull_request:
    branches: [middleeast]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Test traffic data and map safety helpers
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
